# ==============================================================================
# ProxyLoadouts Production Stack (App + Dozzle Log Viewer)
# ==============================================================================
# RAM Footprint: ~40-60 MB total (App ~30-40MB, Dozzle ~10-15MB)
# Disk Log Cap: strictly bounded to 30 MB (max-size: 10m, max-file: 3)
# ==============================================================================

services:
  app:
    image: ghcr.io/kirinyoku/proxyloadouts:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-prod}
    container_name: proxyloadouts-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      # Internal Admin Console — access via SSH tunnel: ssh -L 8889:127.0.0.1:8889 <server>
      - "127.0.0.1:8889:8081"
    environment:
      - PORT=8080
      - ADMIN_PORT=${ADMIN_PORT:-8081}
      - ENV=${ENV:-development}
      - DATABASE_PATH=/app/data/proxyloadouts.db
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      - SESSION_SECRET=${SESSION_SECRET:-dev-session-secret-change-me-32chars-min}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-http://localhost:8080/api/v1/auth/discord/callback}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_THREAD_ID=${TELEGRAM_THREAD_ID:-0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - proxyloadouts-data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Lightweight Web Log Viewer (consumes ~10-15 MB RAM)
  # Bound to 127.0.0.1:8888 — access via SSH tunnel: ssh -L 8888:127.0.0.1:8888 <server>
  dozzle:
    image: amir20/dozzle:latest
    container_name: proxyloadouts-dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle-data:/data
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      # Show only proxyloadouts containers in the UI
      - DOZZLE_FILTER=name=proxyloadouts
      # First run will display the Setup Wizard to create an admin account
      - DOZZLE_NO_ANALYTICS=true

volumes:
  proxyloadouts-data:
  dozzle-data:
