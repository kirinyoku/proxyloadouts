<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Build Manager for Zenless Zone Zero — ProxyLoadouts</title>
    <meta name="description" content="Keep swap-ready equipment loadouts for every agent. Build combat squads for any content without gear conflicts." />
    <script>
      try {
        var style = localStorage.getItem('proxyloadouts_corner_style');
        if (style === 'sharp') {
          document.documentElement.setAttribute('data-corners', 'sharp');
        } else {
          document.documentElement.removeAttribute('data-corners');
        }
        var bgAnim = localStorage.getItem('proxyloadouts_bg_animation');
        if (bgAnim === 'disabled') {
          document.documentElement.setAttribute('data-bg-animation', 'disabled');
        } else {
          document.documentElement.removeAttribute('data-bg-animation');
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;min-height:100dvh;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background-color:#0b0e14;color:#f2e30c;user-select:none;font-family:system-ui,-apple-system,sans-serif;">
        <div style="position:relative;display:flex;width:3.5rem;height:3.5rem;align-items:center;justify-content:center;border-radius:14px 14px 0 14px;border:2px solid #000;background-color:#121720;box-shadow:inset 0 2px 3px rgba(255,255,255,0.08),0 8px 32px rgba(0,0,0,0.5);">
          <svg style="width:2rem;height:2rem;animation:zzz-dual-arc-spin 0.8s linear infinite;color:#f2e30c;filter:drop-shadow(0 0 6px rgba(201,242,75,0.45));" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 12 3 A 9 9 0 0 1 21 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M 12 21 A 9 9 0 0 1 3 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="12" cy="3" r="1" fill="currentColor" opacity="0.25"/>
            <circle cx="12" cy="21" r="1" fill="currentColor" opacity="0.25"/>
          </svg>
        </div>
        <div style="display:flex;align-items:center;gap:0.75rem;">
          <span style="height:0.25rem;width:2rem;border-radius:9999px;background:repeating-linear-gradient(40deg,#f2e30c 0 4px,transparent 4px 8px);opacity:0.6;"></span>
          <span style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.25em;color:#94a3b8;font-weight:600;">
            LOADING…
          </span>
          <span style="height:0.25rem;width:2rem;border-radius:9999px;background:repeating-linear-gradient(40deg,#f2e30c 0 4px,transparent 4px 8px);opacity:0.6;"></span>
        </div>
      </div>
      <style>
        @keyframes zzz-dual-arc-spin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
