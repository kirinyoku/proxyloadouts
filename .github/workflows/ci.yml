name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: OpenAPI 3.1 Contract Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Validate OpenAPI 3.1 Specification
        run: cd frontend && npm run lint:contracts

  backend:
    name: Backend Lint & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Go Vet
        run: cd backend && go vet ./...

      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend
          args: --timeout=5m

      - name: Go Tests with Race Detector
        run: cd backend && go test -v -race ./...

  frontend:
    name: Frontend Lint & Typecheck Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Oxlint
        run: cd frontend && npm run lint

      - name: Vitest Unit & Integration Tests
        run: cd frontend && npm test

      - name: TypeScript Build Check
        run: cd frontend && npm run build

  e2e-smoke:
    name: Playwright Smoke Safety Net
    runs-on: ubuntu-latest
    needs: [backend, frontend, contracts]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E Smoke Tests
        run: cd frontend && npx playwright test

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  standalone-build:
    name: Standalone Binary Verification
    runs-on: ubuntu-latest
    needs: [backend, frontend, contracts]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build Standalone Binary with Embedded Static
        env:
          CGO_ENABLED: '0'
          GIT_SHA: ${{ github.sha }}
        run: make build-all

      - name: Checksum standalone binary
        working-directory: backend/bin
        run: sha256sum server > server.sha256

      - name: Upload standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ github.sha }}
          path: |
            backend/bin/server
            backend/bin/server.sha256
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Standalone Binary to VPS
    runs-on: ubuntu-latest
    needs: [e2e-smoke, standalone-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Validate deployment configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" || { echo '::error::Set the VPS_HOST Actions secret to enable production deployment.'; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo '::error::Set the VPS_SSH_KEY Actions secret to enable production deployment.'; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified standalone binary
        uses: actions/download-artifact@v4
        with:
          name: standalone-${{ github.sha }}
          path: release

      - name: Upload release to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: release/server,release/server.sha256,deploy/install-systemd-release.sh
          target: /tmp/proxyloadouts-${{ github.sha }}
          strip_components: 1

      - name: Install release and verify running commit
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -eu
            release_dir=/tmp/proxyloadouts-${{ github.sha }}
            trap 'rm -rf "$release_dir"' EXIT
            bash "$release_dir/install-systemd-release.sh" "$release_dir" '${{ github.sha }}'
