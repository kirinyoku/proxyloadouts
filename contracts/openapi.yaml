openapi: 3.1.0
info:
  title: ProxyLoadouts API Specification
  description: Contract-First API specification for Zenless Zone Zero loadout presets and real-time equipment conflict detection.
  version: 1.0.0
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: http://localhost:8080/api/v1
    description: Local development / embedded server

paths:
  /health:
    get:
      summary: Health check
      description: Returns service liveness status and current timestamp.
      operationId: getHealth
      tags:
        - System
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - time
                properties:
                  status:
                    type: string
                    example: "ok"
                  time:
                    type: string
                    format: date-time
                    example: "2026-09-06T12:00:00Z"

  /telemetry/client-error:
    post:
      summary: Report unhandled frontend client error
      description: Accepts an unhandled browser/React error report and forwards it to the server-side alerting pipeline.
      operationId: reportClientError
      tags:
        - System
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientErrorReportRequest'
      responses:
        '204':
          description: Error report accepted
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /auth/discord/login:
    get:
      summary: Initiate Discord OAuth2 login
      description: Redirects browser to Discord OAuth2 authorization URL with encrypted state cookie.
      operationId: discordLogin
      tags:
        - Auth
      security: []
      responses:
        '302':
          description: Redirect to Discord OAuth2

  /auth/discord/callback:
    get:
      summary: Complete Discord OAuth2 callback
      description: Exchanges authorization code for user profile, issues encrypted session cookie, and redirects to frontend.
      operationId: discordCallback
      tags:
        - Auth
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to frontend home
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/logout:
    post:
      summary: Terminate session
      description: Clears session cookie and invalidates client session.
      operationId: logout
      tags:
        - Auth
      security: []
      responses:
        '204':
          description: Logged out successfully

  /auth/me:
    get:
      summary: Get current authenticated user profile
      description: Returns user profile details along with all linked game accounts.
      operationId: getMe
      tags:
        - Auth
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Current user profile and accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    delete:
      summary: Permanently delete user account and all data
      description: Permanently deletes the authenticated user, cascading to all linked accounts, builds, and teams. Invalidate session cookie.
      operationId: deleteMe
      tags:
        - Auth
      security:
        - CookieAuth: []
      responses:
        '204':
          description: Account successfully deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /accounts:
    get:
      summary: List linked game accounts
      description: Returns all game accounts linked to the authenticated user.
      operationId: listAccounts
      tags:
        - Accounts
      security:
        - CookieAuth: []
      responses:
        '200':
          description: List of game accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameAccount'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Link a ZZZ game account
      description: Links a new ZZZ UID to the authenticated user with automatic server region detection from the UID prefix (maximum 3 accounts per user).
      operationId: createAccount
      tags:
        - Accounts
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account linked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameAccount'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /accounts/{accountID}:
    patch:
      summary: Update game account settings
      description: Updates privacy settings such as public showcase visibility and Discord identity sharing. Enabling public showcase requires verified ownership.
      operationId: updateAccount
      tags:
        - Accounts
      security:
        - CookieAuth: []
      parameters:
        - name: accountID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Account updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameAccount'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
    delete:
      summary: Unlink a game account
      description: Removes linked game account; cascades to associated builds and teams.
      operationId: deleteAccount
      tags:
        - Accounts
      security:
        - CookieAuth: []
      parameters:
        - name: accountID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Account unlinked successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /accounts/{accountID}/verify/challenge:
    post:
      summary: Start UID ownership verification
      description: Generates or returns an active one-time verification code (PXL-XXXX) to be placed into the in-game profile signature.
      operationId: startAccountVerification
      tags:
        - Accounts
      security:
        - CookieAuth: []
      parameters:
        - name: accountID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Verification challenge generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationChallengeResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /accounts/{accountID}/verify/confirm:
    post:
      summary: Confirm UID ownership verification
      description: Fetches a fresh showcase profile from Enka Network bypassing cache and checks if the player's signature contains the active verification code.
      operationId: confirmAccountVerification
      tags:
        - Accounts
      security:
        - CookieAuth: []
      parameters:
        - name: accountID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account ownership verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameAccount'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '502':
          $ref: '#/components/responses/BadGatewayError'

  /accounts/verify/challenge:
    post:
      summary: Start UID ownership verification by UID
      description: Generates or returns an active one-time verification code (PXL-XXXX) for the given UID to be placed into the in-game profile signature.
      operationId: startVerificationByUID
      tags:
        - Accounts
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationChallengeRequest'
      responses:
        '200':
          description: Verification challenge generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationChallengeResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /accounts/verify/confirm:
    post:
      summary: Confirm UID ownership verification by UID
      description: Fetches fresh showcase profile from Enka Network and checks player signature for the active verification code. Atomically creates or re-claims the game account.
      operationId: confirmVerificationByUID
      tags:
        - Accounts
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationConfirmRequest'
      responses:
        '200':
          description: Account ownership verified and claimed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameAccount'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '502':
          $ref: '#/components/responses/BadGatewayError'

  /showcase/{uid}:
    get:
      summary: Scan player showcase by UID
      description: Public endpoint retrieving character showcase from Enka Network via Fairy SDK. Coalesced with singleflight and cached in-memory.
      operationId: scanShowcase
      tags:
        - Showcase
      security: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{9,10}$'
            example: "1500000000"
        - name: lang
          in: query
          required: false
          description: Preferred localization language for agent equipment and metadata (e.g. 'ru', 'en')
          schema:
            type: string
            default: "ru"
            example: "ru"
      responses:
        '200':
          description: Showcase data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '502':
          $ref: '#/components/responses/BadGatewayError'

  /showcase/{uid}/roster:
    get:
      summary: Get verified public showcase roster
      description: Retrieves publicly shared build presets and squad assemblies for a verified ZZZ UID directly from local database without upstream network calls.
      operationId: getPublicShowcaseRoster
      tags:
        - Showcase
      security: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{9,10}$'
            example: "1500000000"
        - name: lang
          in: query
          required: false
          description: Preferred localization language for agent equipment and metadata (e.g. 'ru', 'en')
          schema:
            type: string
            default: "ru"
            example: "ru"
      responses:
        '200':
          description: Public showcase roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicShowcaseRosterResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /builds:
    get:
      summary: List saved builds for an account
      description: Returns saved agent presets belonging to the specified game account.
      operationId: listBuilds
      tags:
        - Builds
      security:
        - CookieAuth: []
      parameters:
        - name: game_account_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: lang
          in: query
          required: false
          description: Target language for dynamic localization (e.g. ru, en)
          schema:
            type: string
            example: ru
      responses:
        '200':
          description: List of agent builds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Build'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      summary: Save a build preset
      description: Snapshots an agent's current showcase equipment into a saved preset.
      operationId: createBuild
      tags:
        - Builds
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBuildRequest'
      responses:
        '201':
          description: Build saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Build'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /builds/{buildID}:
    get:
      summary: Get detailed build
      description: Retrieves one owned build preset with full equipment payload.
      operationId: getBuild
      tags:
        - Builds
      security:
        - CookieAuth: []
      parameters:
        - name: buildID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lang
          in: query
          required: false
          description: Target language for dynamic localization (e.g. ru, en)
          schema:
            type: string
            example: ru
      responses:
        '200':
          description: Agent build details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Build'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Rename build or update notes
      description: Updates the preset name or optional description. Equipment remains immutable.
      operationId: updateBuildDetails
      tags:
        - Builds
      security:
        - CookieAuth: []
      parameters:
        - name: buildID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchBuildRequest'
      responses:
        '204':
          description: Build updated successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete build preset
      description: Removes an owned build preset. Returns 409 Conflict if referenced by an active team.
      operationId: deleteBuild
      tags:
        - Builds
      security:
        - CookieAuth: []
      parameters:
        - name: buildID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Build deleted successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /public/builds/{buildID}:
    get:
      summary: Get public agent build
      description: Retrieves a single publicly shared agent build with owner metadata. Returns 404 if build is private or owner is banned.
      operationId: getPublicBuild
      tags:
        - Builds
      security: []
      parameters:
        - name: buildID
          in: path
          required: true
          description: Unique build ID
          schema:
            type: string
            format: uuid
        - name: lang
          in: query
          required: false
          description: Target language for dynamic localization (e.g. ru, en)
          schema:
            type: string
            example: ru
      responses:
        '200':
          description: Public agent build details with owner information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBuildResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /teams:
    get:
      summary: List teams for an account
      description: Returns saved teams with member builds and live Conflict Engine validation status.
      operationId: listTeams
      tags:
        - Teams
      security:
        - CookieAuth: []
      parameters:
        - name: game_account_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: lang
          in: query
          required: false
          description: Target language for dynamic localization (e.g. ru, en)
          schema:
            type: string
            example: ru
      responses:
        '200':
          description: List of team summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamSummary'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      summary: Create team preset
      description: Atomically creates a 1–3 agent squad after Conflict Engine verification.
      operationId: createTeam
      tags:
        - Teams
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Team created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /teams/validate:
    get:
      summary: Validate squad composition
      description: >
        Runs the Conflict Engine against candidate build IDs without persisting
        anything. Declared as GET rather than POST because it is a pure read:
        a cacheable verb lets the browser and any intermediary reuse the report
        for a composition that has already been checked, instead of re-running
        the engine on every visit to the same slot arrangement.
      operationId: validateTeam
      tags:
        - Teams
      security:
        - CookieAuth: []
      parameters:
        - name: build_ids
          in: query
          required: true
          description: Comma-separated list of 2-3 build IDs forming the candidate squad.
          schema:
            type: string
            example: 6f1c...-...,9a2b...-...,3c4d...-...
      responses:
        '200':
          description: Validation result report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictReport'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /teams/count:
    get:
      summary: Count teams of a game account
      description: >
        Returns how many teams exist on a game account without serializing the
        teams themselves. Used to enforce the per-account team limit in the UI:
        the full list response embeds every member's complete build payload, so
        fetching it just to read a number is a large avoidable transfer.
      operationId: countTeams
      tags:
        - Teams
      security:
        - CookieAuth: []
      parameters:
        - name: game_account_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Number of teams on the account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCountResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /teams/{teamID}:
    get:
      summary: Get team details
      description: Retrieves team metadata and full build details for each slot.
      operationId: getTeam
      tags:
        - Teams
      security:
        - CookieAuth: []
      parameters:
        - name: teamID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lang
          in: query
          required: false
          description: Target language for dynamic localization (e.g. ru, en)
          schema:
            type: string
            example: ru
      responses:
        '200':
          description: Team details with member builds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDetail'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      summary: Update team composition
      description: Atomically updates team name, description, and replaces member slots after Conflict Engine validation.
      operationId: updateTeam
      tags:
        - Teams
      security:
        - CookieAuth: []
      parameters:
        - name: teamID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
      responses:
        '200':
          description: Team updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
    patch:
      summary: Partially update team preset
      description: Updates the team preset name, description, or visibility flag. Roster slots remain untouched.
      operationId: patchTeam
      tags:
        - Teams
      security:
        - CookieAuth: []
      parameters:
        - name: teamID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lang
          in: query
          required: false
          description: Target language for dynamic localization (e.g. ru, en)
          schema:
            type: string
            example: ru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTeamRequest'
      responses:
        '200':
          description: Team updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSummary'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete team preset
      description: Removes an owned team; members cascade deleted.
      operationId: deleteTeam
      tags:
        - Teams
      security:
        - CookieAuth: []
      parameters:
        - name: teamID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Team deleted successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /public/teams/{teamID}:
    get:
      summary: Get public team details
      description: Retrieves a single publicly shared team squad preset with member details and owner metadata. Returns 404 if team is private or owner is banned.
      operationId: getPublicTeam
      tags:
        - Teams
      security: []
      parameters:
        - name: teamID
          in: path
          required: true
          description: Unique team ID
          schema:
            type: string
            format: uuid
        - name: lang
          in: query
          required: false
          description: Target language for dynamic localization (e.g. ru, en)
          schema:
            type: string
            example: ru
      responses:
        '200':
          description: Public squad composition with member builds and owner information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTeamResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  # -----------------------------------------------------------------------
  # Admin surface (docs/product/PRD-admin-dashboard.md)
  #
  # Every /admin/* operation requires a session whose Discord ID is in the
  # ADMIN_DISCORD_IDS allowlist. Authenticated non-admins receive 404 so the
  # surface is not discoverable. Every mutation writes an admin_audit_log entry.
  # -----------------------------------------------------------------------

  /admin/stats:
    get:
      summary: Usage overview
      description: Point-in-time usage counters and a zero-filled daily registrations series.
      operationId: adminGetStats
      tags:
        - Admin
      security:
        - CookieAuth: []
      parameters:
        - name: days
          in: query
          required: false
          description: Length of the registrations_daily series in UTC days.
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        '200':
          description: Usage statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStats'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/users:
    get:
      summary: Search users
      description: >
        Paginated user list, newest first. `q` matches a username substring
        (case-insensitive), an exact Discord ID, or an exact linked ZZZ UID.
      operationId: adminListUsers
      tags:
        - Admin
      security:
        - CookieAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, active, banned]
            default: all
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/users/{userID}:
    get:
      summary: Get user detail
      description: Profile, linked game accounts, entity counts and ban state. Never includes build or team contents.
      operationId: adminGetUser
      tags:
        - Admin
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AdminUserID'
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Permanently delete a user
      description: >
        Deletes the user and cascades to accounts, builds and teams. Rejected with
        409 when the target is the caller or another admin. Audited as `user.delete`.
      operationId: adminDeleteUser
      tags:
        - Admin
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AdminUserID'
      responses:
        '204':
          description: User deleted
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /admin/users/{userID}/sessions/revoke:
    post:
      summary: Sign a user out everywhere
      description: Increments the user's token_version, invalidating every issued session cookie. Audited as `user.sessions_revoke`.
      operationId: adminRevokeUserSessions
      tags:
        - Admin
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AdminUserID'
      responses:
        '204':
          description: Sessions revoked
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/users/{userID}/ban:
    put:
      summary: Ban a user
      description: >
        Sets banned_at and ban_reason and revokes all sessions. Banned users cannot
        complete Discord login. Idempotent: banning an already banned user updates the
        reason. Rejected with 409 when the target is the caller or another admin.
        Audited as `user.ban`.
      operationId: adminBanUser
      tags:
        - Admin
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AdminUserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBanRequest'
      responses:
        '200':
          description: User banned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
    delete:
      summary: Unban a user
      description: Clears banned_at and ban_reason. Idempotent. Audited as `user.unban`.
      operationId: adminUnbanUser
      tags:
        - Admin
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AdminUserID'
      responses:
        '200':
          description: User unbanned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/system:
    get:
      summary: Runtime and storage information
      description: Build version, uptime, SQLite file sizes, cache fill levels and non-secret configuration.
      operationId: adminGetSystem
      tags:
        - Admin
      security:
        - CookieAuth: []
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSystemInfo'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/caches/{cacheName}:
    delete:
      summary: Clear a cache
      description: Removes every entry from the named in-memory cache. Audited as `cache.clear`.
      operationId: adminClearCache
      tags:
        - Admin
      security:
        - CookieAuth: []
      parameters:
        - name: cacheName
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AdminCacheName'
      responses:
        '204':
          description: Cache cleared
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/showcase-cache/{uid}:
    delete:
      summary: Purge cached showcase for a UID
      description: >
        Removes the UID from both the positive profile cache and the negative cache so
        the next scan hits EnkaNetwork. Idempotent. Audited as `cache.purge_uid`.
      operationId: adminPurgeShowcaseCache
      tags:
        - Admin
      security:
        - CookieAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{9,10}$'
      responses:
        '204':
          description: Cache entries purged (or were absent)
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/audit-log:
    get:
      summary: List admin audit entries
      description: Append-only log of admin mutations, newest first.
      operationId: adminListAuditLog
      tags:
        - Admin
      security:
        - CookieAuth: []
      parameters:
        - name: action
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AdminAuditAction'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of audit entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditPage'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  parameters:
    AdminUserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: pl_session
      description: AES-256-GCM encrypted session cookie issued on Discord OAuth2 completion (named __Host-pl_session in production).

  schemas:
    User:
      type: object
      required:
        - id
        - discord_id
        - username
        - created_at
      properties:
        id:
          type: string
          format: uuid
        discord_id:
          type: string
        username:
          type: string
        avatar_url:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time

    GameAccount:
      type: object
      required:
        - id
        - uid
        - region
        - is_public_roster
        - is_public_teams
        - show_discord
        - created_at
      properties:
        id:
          type: string
          format: uuid
        uid:
          type: string
          example: "1500000000"
        region:
          type: string
          enum: [Europe, America, Asia, TW/HK/MO]
          example: "Europe"
        nickname:
          type:
            - string
            - "null"
          example: "ProxyLeader"
        avatar_url:
          type:
            - string
            - "null"
        verified_at:
          type:
            - string
            - "null"
          format: date-time
        is_public_roster:
          type: boolean
          default: true
        is_public_teams:
          type: boolean
          default: true
        is_public_showcase:
          type: boolean
          default: false
          deprecated: true
        show_discord:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time

    CreateAccountRequest:
      type: object
      required:
        - uid
      properties:
        uid:
          type: string
          pattern: '^[0-9]{9,10}$'
        region:
          type: string
          description: Server region (optional; automatically determined from 10-digit UID prefix if omitted)
          enum: [Europe, America, Asia, TW/HK/MO]
          example: "Europe"

    UpdateAccountRequest:
      type: object
      properties:
        is_public_roster:
          type: boolean
          description: Whether this account's agent presets are public (requires verified ownership)
        is_public_teams:
          type: boolean
          description: Whether this account's team squads are public (requires verified ownership)
        is_public_showcase:
          type: boolean
          deprecated: true
          description: Deprecated alias for updating both roster and teams visibility
        show_discord:
          type: boolean
          description: Whether to display owner's Discord identity on public pages

    VerificationChallengeRequest:
      type: object
      required:
        - uid
      properties:
        uid:
          type: string
          pattern: '^[0-9]{9,10}$'
        region:
          type: string
          description: Server region (optional; automatically determined from 10-digit UID prefix if omitted)
          enum: [Europe, America, Asia, TW/HK/MO]
          example: "Europe"

    VerificationConfirmRequest:
      type: object
      required:
        - uid
      properties:
        uid:
          type: string
          pattern: '^[0-9]{9,10}$'
        region:
          type: string
          description: Server region (optional; automatically determined from 10-digit UID prefix if omitted)
          enum: [Europe, America, Asia, TW/HK/MO]
          example: "Europe"

    VerificationChallengeResponse:
      type: object
      required:
        - code
        - expires_at
        - cooldown_seconds
      properties:
        code:
          type: string
          example: "PXL-9A4B"
        expires_at:
          type: string
          format: date-time
        cooldown_seconds:
          type: integer
          example: 30

    UserLimits:
      type: object
      required:
        - max_builds_per_agent
        - max_teams_per_account
        - max_accounts_per_user
      properties:
        max_builds_per_agent:
          type: integer
          minimum: 1
          description: Effective maximum number of saved builds per agent for this user
          example: 10
        max_teams_per_account:
          type: integer
          minimum: 1
          description: Effective maximum number of saved teams per account for this user
          example: 100
        max_accounts_per_user:
          type: integer
          minimum: 1
          description: Effective maximum number of linked game accounts (ZZZ UIDs) for this user
          example: 3

    MeResponse:
      type: object
      required:
        - user
        - accounts
        - limits
      properties:
        user:
          $ref: '#/components/schemas/User'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/GameAccount'
        limits:
          $ref: '#/components/schemas/UserLimits'
        is_admin:
          type: boolean
          description: >
            True when the user's Discord ID is in the server-side admin allowlist.
            UI hint only (shows the /admin entry point); the server re-checks on every admin request.
            Omitted by servers that predate the admin surface — treat absence as false.

    Build:
      type: object
      required:
        - id
        - game_account_id
        - agent_id
        - agent_name
        - name
        - disc_uids
        - build_data
        - is_public
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        game_account_id:
          type: string
          format: uuid
        agent_id:
          type: integer
          example: 1511
        agent_name:
          type: string
          example: "Miyabi"
        name:
          type: string
          example: "Anomaly DPS"
        description:
          type:
            - string
            - "null"
        weapon_uid:
          type:
            - string
            - "null"
        weapon_id:
          type:
            - integer
            - "null"
        disc_uids:
          type: array
          items:
            type: string
        build_data:
          type: object
          description: Full enriched agent payload from Enka / Fairy
        is_public:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateBuildRequest:
      type: object
      required:
        - game_account_id
        - raw_agent_payload
      properties:
        game_account_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
            - string
            - "null"
        raw_agent_payload:
          type: object
          description: Agent JSON payload from showcase
        raw_data:
          type: object
          description: Optional raw zzz.AvatarData JSON payload (ignored when server scanner is active)

    PatchBuildRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type:
            - string
            - "null"
        is_public:
          type: boolean

    Team:
      type: object
      required:
        - id
        - game_account_id
        - name
        - is_public
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        game_account_id:
          type: string
          format: uuid
        name:
          type: string
          example: "Ice Anomaly Trio"
        description:
          type:
            - string
            - "null"
        is_public:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TeamMember:
      type: object
      required:
        - slot_number
        - build
      properties:
        slot_number:
          type: integer
          minimum: 1
          maximum: 3
        build:
          $ref: '#/components/schemas/Build'

    TeamDetail:
      type: object
      required:
        - team
        - members
      properties:
        team:
          $ref: '#/components/schemas/Team'
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'

    TeamSummary:
      type: object
      required:
        - team
        - report
        - members
      properties:
        team:
          $ref: '#/components/schemas/Team'
        report:
          $ref: '#/components/schemas/ConflictReport'
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'

    TeamCountResponse:
      type: object
      required:
        - count
        - max
      properties:
        count:
          type: integer
          minimum: 0
          description: Number of teams on the game account
          example: 3
        max:
          type: integer
          minimum: 1
          description: Effective maximum number of teams allowed on this account for the current user
          example: 100

    CreateTeamRequest:
      type: object
      required:
        - game_account_id
        - build_ids
      properties:
        game_account_id:
          type: string
          format: uuid
        name:
          type: string
          description: Squad preset name. If omitted or empty, auto-generated from member agent names (e.g. "Aria/Nangong Yu/Sanna").
        description:
          type:
            - string
            - "null"
        is_public:
          type: boolean
        build_ids:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            format: uuid

    UpdateTeamRequest:
      type: object
      required:
        - game_account_id
        - build_ids
      properties:
        game_account_id:
          type: string
          format: uuid
        name:
          type: string
          description: Squad preset name. If omitted or empty, auto-generated from member agent names (e.g. "Aria/Nangong Yu/Sanna").
        description:
          type:
            - string
            - "null"
        is_public:
          type: boolean
        build_ids:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            format: uuid

    PatchTeamRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type:
            - string
            - "null"
        is_public:
          type: boolean

    ConflictCode:
      type: string
      enum:
        - DUPLICATE_AGENT
        - ITEM_REUSE
        - WEAPON_REUSE
        - ACCOUNT_MISMATCH

    ConflictError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ConflictCode'
        message:
          type: string
        agent_id:
          type: integer
        item_type:
          type: string
          enum: [drive_disc, w_engine]
        item_uid:
          type: string
        slot:
          type: integer
        conflicting_builds:
          type: array
          items:
            type: string

    ConflictReport:
      type: object
      required:
        - is_valid
        - errors
      properties:
        is_valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ConflictError'

    PublicOwnerInfo:
      type: object
      required:
        - uid
        - region
        - nickname
        - avatar_url
      properties:
        uid:
          type: string
          example: "1500000000"
        region:
          type: string
          enum: [Europe, America, Asia, TW/HK/MO]
          example: "Europe"
        nickname:
          type:
            - string
            - "null"
          example: "ProxyLeader"
        avatar_url:
          type:
            - string
            - "null"
        discord_username:
          type:
            - string
            - "null"
          description: Owner's Discord username (only populated if show_discord is true)
          example: "ProxyLeader"
        discord_avatar_url:
          type:
            - string
            - "null"
          description: Owner's Discord avatar URL (only populated if show_discord is true)

    PublicBuildResponse:
      type: object
      required:
        - build
        - owner
      properties:
        build:
          $ref: '#/components/schemas/Build'
        owner:
          $ref: '#/components/schemas/PublicOwnerInfo'

    PublicTeamResponse:
      type: object
      required:
        - team
        - report
        - members
        - owner
      properties:
        team:
          $ref: '#/components/schemas/Team'
        report:
          $ref: '#/components/schemas/ConflictReport'
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
        owner:
          $ref: '#/components/schemas/PublicOwnerInfo'

    PublicShowcaseRosterResponse:
      type: object
      required:
        - owner
        - is_public_roster
        - is_public_teams
        - is_public_showcase
        - builds
        - teams
      properties:
        owner:
          $ref: '#/components/schemas/PublicOwnerInfo'
        is_public_roster:
          type: boolean
        is_public_teams:
          type: boolean
        is_public_showcase:
          type: boolean
          deprecated: true
        builds:
          type: array
          items:
            $ref: '#/components/schemas/Build'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamSummary'

    ShowcaseResponse:
      type: object
      required:
        - uid
        - nickname
        - region
        - interknot_level
        - source
        - ttl_seconds
        - fetched_at
        - agent_count
        - agents
      properties:
        uid:
          type: string
        nickname:
          type: string
        region:
          type: string
        interknot_level:
          type: integer
        avatar_url:
          type: string
        source:
          type: string
          enum: [fresh, cached]
        ttl_seconds:
          type: integer
        fetched_at:
          type: string
          format: date-time
        agent_count:
          type: integer
        agents:
          type: array
          items:
            type: object
        verified_owner:
          anyOf:
            - $ref: '#/components/schemas/PublicOwnerInfo'
            - type: "null"
          description: Public owner profile if UID is claimed and verified by an active user
        has_public_roster:
          type: boolean
          description: True if verified owner has published presets and squads

    # ---------------------------------------------------------------------
    # Admin (see docs/product/PRD-admin-dashboard.md)
    # ---------------------------------------------------------------------

    AdminStats:
      type: object
      required:
        - generated_at
        - users_total
        - users_new_24h
        - users_new_7d
        - users_new_30d
        - users_banned
        - game_accounts_total
        - builds_total
        - teams_total
        - accounts_by_region
        - registrations_daily
      properties:
        generated_at:
          type: string
          format: date-time
        users_total:
          type: integer
          minimum: 0
        users_new_24h:
          type: integer
          minimum: 0
        users_new_7d:
          type: integer
          minimum: 0
        users_new_30d:
          type: integer
          minimum: 0
        users_banned:
          type: integer
          minimum: 0
        game_accounts_total:
          type: integer
          minimum: 0
        builds_total:
          type: integer
          minimum: 0
        teams_total:
          type: integer
          minimum: 0
        accounts_by_region:
          type: array
          items:
            type: object
            required:
              - region
              - count
            properties:
              region:
                type: string
                enum: [Europe, America, Asia, TW/HK/MO]
              count:
                type: integer
                minimum: 0
        registrations_daily:
          type: array
          description: One entry per UTC day, oldest first, zero-filled for days without registrations.
          items:
            type: object
            required:
              - date
              - count
            properties:
              date:
                type: string
                format: date
                example: "2026-10-13"
              count:
                type: integer
                minimum: 0

    AdminUserSummary:
      type: object
      required:
        - id
        - discord_id
        - username
        - avatar_url
        - created_at
        - banned_at
        - is_admin
        - accounts_count
        - builds_count
        - teams_count
      properties:
        id:
          type: string
          format: uuid
        discord_id:
          type: string
        username:
          type: string
        avatar_url:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
        banned_at:
          type:
            - string
            - "null"
          format: date-time
          description: Null when the user is not banned.
        is_admin:
          type: boolean
        accounts_count:
          type: integer
          minimum: 0
        builds_count:
          type: integer
          minimum: 0
        teams_count:
          type: integer
          minimum: 0

    AdminUserDetail:
      allOf:
        - $ref: '#/components/schemas/AdminUserSummary'
        - type: object
          required:
            - ban_reason
            - accounts
          properties:
            ban_reason:
              type:
                - string
                - "null"
            accounts:
              type: array
              items:
                $ref: '#/components/schemas/GameAccount'

    AdminUserPage:
      type: object
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserSummary'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100

    AdminBanRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          example: "Automated scraping of showcase endpoint"

    AdminCacheName:
      type: string
      enum:
        - profile
        - negative
        - build_enrich

    AdminSystemInfo:
      type: object
      required:
        - version
        - commit
        - go_version
        - env
        - started_at
        - uptime_seconds
        - database
        - caches
        - config
      properties:
        version:
          type: string
          example: "1.4.0"
        commit:
          type: string
          example: "9745a2b"
        go_version:
          type: string
          example: "go1.26.0"
        env:
          type: string
          example: "production"
        started_at:
          type: string
          format: date-time
        uptime_seconds:
          type: integer
          minimum: 0
        database:
          type: object
          required:
            - size_bytes
            - wal_size_bytes
          properties:
            size_bytes:
              type: integer
              minimum: 0
            wal_size_bytes:
              type: integer
              minimum: 0
        caches:
          type: array
          items:
            type: object
            required:
              - name
              - entries
              - capacity
            properties:
              name:
                $ref: '#/components/schemas/AdminCacheName'
              entries:
                type: integer
                minimum: 0
              capacity:
                type: integer
                minimum: 0
        config:
          type: object
          description: Non-secret runtime configuration only. Secrets are never exposed.
          required:
            - showcase_rate_limit_per_minute
            - showcase_burst
            - enka_timeout_seconds
          properties:
            showcase_rate_limit_per_minute:
              type: integer
            showcase_burst:
              type: integer
            enka_timeout_seconds:
              type: integer

    AdminAuditAction:
      type: string
      enum:
        - user.delete
        - user.ban
        - user.unban
        - user.sessions_revoke
        - cache.purge_uid
        - cache.clear

    AdminAuditEntry:
      type: object
      required:
        - id
        - created_at
        - admin_user_id
        - admin_username
        - action
        - target_type
        - target_id
        - metadata
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        admin_user_id:
          type: string
          format: uuid
          description: Not a foreign key — the entry must survive deletion of either party.
        admin_username:
          type: string
          description: Username snapshot at the time of the action.
        action:
          $ref: '#/components/schemas/AdminAuditAction'
        target_type:
          type: string
          enum: [user, cache]
        target_id:
          type: string
          description: User UUID, cache name, or ZZZ UID depending on the action.
        metadata:
          type: object
          description: Action-specific details, e.g. {"reason":"..."} for bans or {"username":"..."} for deletions.

    AdminAuditPage:
      type: object
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminAuditEntry'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100

    ClientErrorReportRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 500
          example: "TypeError: Cannot read properties of undefined (reading 'id')"
        stack:
          type: string
          maxLength: 4000
          example: "TypeError: Cannot read properties of undefined\n    at RosterPage (RosterPage.tsx:42:15)"
        component_stack:
          type: string
          maxLength: 4000
          example: "\n    at RosterPage\n    at ErrorBoundary"
        url:
          type: string
          maxLength: 500
          example: "https://proxyloadouts.com/roster"

    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "entity not found"

    ValidationErrorEnvelope:
      type: object
      required:
        - error
        - conflicts
      properties:
        error:
          type: string
          example: "team has equipment conflicts"
        conflicts:
          $ref: '#/components/schemas/ConflictReport'

  responses:
    BadRequestError:
      description: Malformed or invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnauthorizedError:
      description: Authentication required or session expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenError:
      description: Attempted access to a resource belonging to another user (anti-IDOR)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ConflictError:
      description: Conflict with existing state (e.g. build in active team)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntityError:
      description: Conflict Engine rejected squad composition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
    RateLimitedError:
      description: Enka Network rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadGatewayError:
      description: Upstream game source (Enka / Fairy) unavailable or maintenance
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalServerError:
      description: Unexpected internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
